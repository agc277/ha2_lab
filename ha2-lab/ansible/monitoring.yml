- name: 安裝 node_exporter
  hosts: monitor:balancers:apps:scale
  tasks:
    - name: 安裝 tar
      dnf:
        name: tar
        state: present

    - name: 建立服務帳號
      user:
        name: node_exporter
        system: yes
        shell: /sbin/nologin
        create_home: no

    - name: 下載並解壓
      unarchive:
        src: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /opt
        remote_src: yes
        creates: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

    - name: 建立 textfile 目錄
      file:
        path: /var/lib/node_exporter
        state: directory
        mode: "0755"

    - name: 安裝執行檔
      copy:
        src: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        remote_src: yes
        mode: "0755"
      notify: 重啟 node_exporter

    - name: 修正 SELinux 標籤
      command: restorecon -v /usr/local/bin/node_exporter
      register: r
      changed_when: "'Relabeled' in r.stdout"

    - name: systemd 服務檔
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter --collector.textfile.directory=/var/lib/node_exporter
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: 重啟 node_exporter

    - name: 開放 9100
      ansible.posix.firewalld:
        port: 9100/tcp
        zone: "{{ 'internal' if inventory_hostname == 'ctl' else 'public' }}"
        permanent: yes
        immediate: yes
        state: enabled

    - name: 啟動 node_exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: 重啟 node_exporter
      systemd:
        name: node_exporter
        state: restarted
        daemon_reload: yes

- name: 安裝 Prometheus
  hosts: monitor
  vars:
    prom_dir: "/opt/prometheus-{{ prometheus_version }}.linux-amd64"
  tasks:
    - name: 建立服務帳號
      user:
        name: prometheus
        system: yes
        shell: /sbin/nologin
        create_home: no

    - name: 下載並解壓
      unarchive:
        src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: /opt
        remote_src: yes
        creates: "{{ prom_dir }}/prometheus"

    - name: 建立 /opt/prometheus 捷徑
      file:
        src: "{{ prom_dir }}"
        dest: /opt/prometheus
        state: link

    - name: 修正 SELinux 標籤
      command: "restorecon -Rv {{ prom_dir }}"
      register: r
      changed_when: "'Relabeled' in r.stdout"

    - name: 建立設定與資料目錄
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
      loop: [/etc/prometheus, /var/lib/prometheus]

    - name: 放入告警規則
      copy:
        src: files/alert_rules.yml
        dest: /etc/prometheus/rules.yml
        owner: prometheus
        validate: /opt/prometheus/promtool check rules %s
      notify: 重啟 Prometheus

    - name: 放入設定檔
      template:
        src: templates/prometheus.yml.j2
        dest: /etc/prometheus/prometheus.yml
        validate: /opt/prometheus/promtool check config %s
      notify: 重啟 Prometheus

    - name: systemd 服務檔
      copy:
        dest: /etc/systemd/system/prometheus.service
        content: |
          [Unit]
          Description=Prometheus
          After=network-online.target

          [Service]
          User=prometheus
          ExecStart=/opt/prometheus/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus \
            --web.listen-address=:9090
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
      notify: 重啟 Prometheus

    - name: 開放 9090（internal zone）
      ansible.posix.firewalld:
        port: 9090/tcp
        zone: internal
        permanent: yes
        immediate: yes
        state: enabled

    - name: 啟動 Prometheus
      systemd:
        name: prometheus
        state: started
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: 重啟 Prometheus
      systemd:
        name: prometheus
        state: restarted
        daemon_reload: yes
